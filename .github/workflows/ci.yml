name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install web-admin deps
        run: cd web-admin && npm ci
      - name: ESLint (root)
        run: npx eslint . --ext .ts,.tsx --max-warnings 250 --quiet
      - name: ESLint (web-admin)
        run: cd web-admin && npx eslint . --ext .ts,.tsx --max-warnings 250 --quiet
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Prettier check
        run: npx prettier --check "**/*.{ts,tsx,json,md}"
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        run: |
          set -e
          FOUND=0
          # Appwrite server API keys
          if git grep -nE 'standard_[0-9a-f]{32,}' -- . ':!*.md' | grep -v 'your' ; then
            echo "::error::Appwrite API key committed"; FOUND=1
          fi
          # ElevenLabs keys (32 hex chars)
          if git grep -nE '[0-9a-f]{32}' -- . ':!*.md' ':!package-lock.json' ':!web-admin/package-lock.json' | grep -viE 'your|example|placeholder|hash|sha|md5' ; then
            echo "::error::Possible API key committed"; FOUND=1
          fi
          # OpenRouter / Anthropic keys
          if git grep -nE 'sk-or-v1-[0-9a-f]{32,}|sk-ant-[0-9a-zA-Z_-]{20,}' -- . ':!*.md' | grep -v 'your' ; then
            echo "::error::AI provider key committed"; FOUND=1
          fi
          exit $FOUND
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Jest
        run: npx jest --ci --passWithNoTests
  build-check:
    name: Expo Export Check
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Expo export (web)
        run: npx expo export --platform web
        env:
          EXPO_NO_TELEMETRY: 1
